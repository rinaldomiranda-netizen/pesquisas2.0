<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a"><meta name="description" content="Pesquisa 2.0 — gestão de pesquisa de campo">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Pesquisa 2.0</title>
<style>
:root{--nav:#0b1f3a;--accent:#2f7cf6;--bg:#f3f6fb;--card:#fff;--text:#172235;--muted:#718096;--line:#e3e9f2;--ok:#168a52;--danger:#d64545}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.side{width:250px;background:linear-gradient(180deg,var(--nav),#07172c);color:#fff;position:fixed;inset:0 auto 0 0;padding:18px 14px;z-index:20}.brand{display:flex;gap:10px;align-items:center;padding:8px 10px 22px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#3f8cff,#69a8ff);display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#9db0c9}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#cbd7e8;text-align:left;border:0;padding:12px;border-radius:11px;font-size:14px}.nav button:hover,.nav button.active{background:#ffffff19;color:#fff}.main{margin-left:250px;flex:1}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:10}.top h1{margin:0;font-size:20px}.top p{margin:3px 0;color:var(--muted);font-size:12px}.content{padding:24px;max-width:1450px;margin:auto}.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 25px #1027440d}.kpi{display:flex;justify-content:space-between}.value{font-size:30px;font-weight:850;margin-top:6px}.muted{color:var(--muted)}button,.btn,input,select{font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;background:#edf2f8;color:#243650;cursor:pointer}.primary{background:var(--accent);color:#fff}.success{background:#eaf8f1;color:#147347}.danger{background:#fff0f0;color:#a42f2f}.actions{display:flex;flex-wrap:wrap;gap:8px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d6dfeb;border-radius:10px;background:#fff}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}.table table{width:100%;min-width:650px;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{background:#f8fafc;color:#596a82}.tag{padding:4px 8px;border-radius:99px;background:#eef4ff;color:#245aa8;font-size:11px}.tag.ok{background:#eaf8f1;color:#147347}.notice{padding:12px;border-radius:10px;background:#f7f9fc;border:1px solid var(--line);font-size:13px}.notice.ok{background:#eaf8f1;border-color:#bfe8d2}.notice.err{background:#fff0f0;border-color:#ffd0d0;color:#a42f2f}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 60px #10274418}.loginbox h1{text-align:center}.loginbox .logo{margin:auto}.loginbox .field{margin-top:18px}.mobile{display:none}
@media(max-width:850px){.side{width:78px;padding:14px 9px}.brand div:not(.logo),.nav button span{display:none}.brand{justify-content:center}.nav button{text-align:center;font-size:19px}.main{margin-left:78px}.content{padding:15px}.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.top{padding:0 14px}.top .hint{display:none}}
</style></head><body>
<div id="app"></div>
<script>
const API="https://oqqksddzwrlkqnfpfshu.supabase.co/functions/v1/field-access";
let token=new URLSearchParams(location.search).get("access")||"",session=localStorage.p20_session||"",access=JSON.parse(localStorage.p20_access||"null"),data={locations:[],sections:[],assignments:[],researchers:[],sectors:[]};
const $=id=>document.getElementById(id),esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
async function api(action,body={},auth=true){const h={"Content-Type":"application/json"};if(auth&&session)h["x-field-session"]=session;const r=await fetch(API,{method:"POST",headers:h,body:JSON.stringify({action,...body})});const j=await r.json();if(!r.ok)throw Error(j.error||"Erro");return j}
async function load(){data=await api("list_data",{});if(access?.role==="admin"){try{data.links=(await api("list_links")).links||[]}catch{}}}
function login(){document.body.innerHTML='<div class="login"><div class="loginbox"><div class="logo">P2</div><h1>Pesquisa 2.0</h1><p class="muted" style="text-align:center">Acesso seguro à pesquisa de campo</p><div id="lm"></div><div class="field"><label>Senha de acesso</label><input id="pw" type="password" value="1234"></div><br><button class="btn primary" style="width:100%" onclick="enter()">Entrar</button></div></div>'}
async function enter(){try{let j=await api("login",{link_token:token,password:$("pw").value},false);session=j.session_token;access=j.access;localStorage.p20_session=session;localStorage.p20_access=JSON.stringify(access);await load();render("dashboard")}catch(e){$("lm").innerHTML='<div class="notice err">'+esc(e.message)+"</div><br>"}}
function k(t,v,i){return '<div class="card kpi"><div><div class="muted">'+t+'</div><div class="value">'+v+'</div></div><div style="font-size:24px">'+i+'</div></div>'}
function shell(title,sub,body,active){document.body.innerHTML='<div class="app"><aside class="side"><div class="brand"><div class="logo">P2</div><div><b>Pesquisa 2.0</b><small>Pesquisa de campo</small></div></div><nav class="nav">'+(access?.role==='admin'?'<button class="'+(active==='dashboard'?'active':'')+'" onclick="render(\'dashboard\')">▦ <span>Dashboard</span></button><button class="'+(active==='cadastro'?'active':'')+'" onclick="render(\'cadastro\')">＋ <span>Novo cadastro</span></button><button class="'+(active==='setores'?'active':'')+'" onclick="render(\'setores\')">◉ <span>Setores e sessões</span></button><button class="'+(active==='relatorios'?'active':'')+'" onclick="render(\'relatorios\')">▤ <span>Relatórios</span></button><button class="'+(active==='pesquisadores'?'active':'')+'" onclick="render(\'pesquisadores\')">♙ <span>Pesquisadores</span></button><button class="'+(active==='diretoria'?'active':'')+'" onclick="render(\'diretoria\')">⌂ <span>Diretoria</span></button><button class="'+(active==='importar'?'active':'')+'" onclick="render(\'importar\')">⇧ <span>Importar base</span></button>':'<button class="active" onclick="render(\'entrevista\')">✓ <span>Entrevista</span></button>')+'</nav><div style="margin-top:auto"><button class="nav-btn nav" onclick="logout()">↪ <span>Sair</span></button></div></aside><main class="main"><header class="top"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions"><span class="tag">'+esc(access?.role||"")+'</span><button class="btn" onclick="load().then(()=>render(\''+active+'\'))">↻ Atualizar</button></div></header><section class="content">'+body+'</section></main></div>'}
function render(p){if(p==='dashboard')return dashboard();if(p==='cadastro')return cadastro();if(p==='setores')return setores();if(p==='relatorios')return relatorios();if(p==='pesquisadores')return pesquisadores();if(p==='diretoria')return diretoria();if(p==='importar')return importar();if(p==='entrevista')return entrevista()}
function dashboard(){shell('Dashboard','Visão geral da operação de campo','<div class="grid kpis">'+k('Cadastros',data.assignments.length,'✓')+k('Setores',data.sectors.length,'▦')+k('Escolas',data.locations.length,'⌂')+k('Sessões',data.sections.length,'◉')+'</div><br><div class="grid two"><div class="card"><h2>Pesquisa 2.0</h2><p class="muted">Gestão de pesquisadores, escolas, zonas e sessões.</p><br><div class="actions"><button class="btn primary" onclick="render(\'cadastro\')">＋ Novo cadastro</button><button class="btn" onclick="render(\'setores\')">Abrir setores e sessões</button></div></div><div class="card"><h2>Regra de alocação</h2><p>Máximo de <b>2 pessoas por sessão</b>: uma no período da manhã e uma no período da tarde.</p></div></div>','dashboard')}
function cadastro(){let opts=(data.sections||[]).map(s=>{let l=data.locations.find(x=>x.id===s.polling_location_id);return '<option value="'+s.id+'">'+esc(l?.school_name||'')+' — Zona '+esc(l?.zone||s.zone||'')+' — Sessão '+esc(s.section)+'</option>'}).join('');shell('Novo cadastro','Alocação de pessoa em uma sessão','<div class="card"><div id="cm"></div><div class="formgrid"><div class="field"><label>Nome</label><input id="cn"></div><div class="field"><label>Telefone</label><input id="cp"></div><div class="field"><label>Sessão</label><select id="cs">'+opts+'</select></div><div class="field"><label>Período</label><select id="ct"><option value="morning">Manhã</option><option value="afternoon">Tarde</option></select></div></div><br><button class="btn primary" onclick="createA()">Cadastrar</button></div>','cadastro')}
async function createA(){try{let j=await api('create_assignment',{person_name:$("cn").value,phone:$("cp").value,section_id:$("cs").value,period:$("ct").value});await load();$("cm").innerHTML='<div class="notice ok">Cadastro realizado com sucesso.</div>'}catch(e){$("cm").innerHTML='<div class="notice err">'+esc(e.message)+'</div>'}}
function setores(){let rows=data.sectors.map(s=>{let loc=data.locations.filter(l=>l.sector_id===s.id),ids=data.sections.filter(x=>loc.some(l=>l.id===x.polling_location_id));return '<tr><td>'+esc(s.name)+'</td><td>'+loc.length+'</td><td>'+ids.length+'</td><td><button class="btn small" onclick="setor(\''+s.id+'\')">Abrir</button></td></tr>'}).join('');shell('Setores e sessões','Escolas, zonas e sessões por setor','<div class="card"><div class="table"><table><tr><th>Setor</th><th>Escolas</th><th>Sessões</th><th></th></tr>'+rows+'</table></div></div>','setores')}
function setor(id){let s=data.sectors.find(x=>x.id===id),loc=data.locations.filter(l=>l.sector_id===id),ids=new Set(data.sections.filter(x=>loc.some(l=>l.id===x.polling_location_id)).map(x=>x.id)),rows=data.assignments.filter(a=>ids.has(a.section_id)).map(a=>{let sec=data.sections.find(x=>x.id===a.section_id),l=data.locations.find(x=>x.id===sec?.polling_location_id),r=data.researchers.find(x=>x.id===a.researcher_id);return '<tr><td>'+esc(l?.school_name||'')+'</td><td>'+esc(l?.zone||'')+'</td><td>'+esc(sec?.section||'')+'</td><td>'+esc(a.person_name)+'</td><td>'+esc(a.phone||'')+'</td><td>'+ (a.period==='morning'?'Manhã':'Tarde')+'</td><td>'+esc(r?.full_name||'')+'</td></tr>'}).join('');shell('Setor '+esc(s?.name||''),'Detalhamento do setor','<div class="card"><button class="btn" onclick="render(\'setores\')">← Voltar</button><br><br><div class="table"><table><tr><th>Colégio</th><th>Zona</th><th>Sessão</th><th>Nome</th><th>Telefone</th><th>Período</th><th>Pesquisador</th></tr>'+rows+'</table></div></div>','setores')}
function relatorios(){let rows=data.assignments.map(a=>{let s=data.sections.find(x=>x.id===a.section_id),l=data.locations.find(x=>x.id===s?.polling_location_id),r=data.researchers.find(x=>x.id===a.researcher_id);return '<tr><td>'+esc(a.person_name)+'</td><td>'+esc(a.phone||'')+'</td><td>'+esc(l?.zone||s?.zone||'')+'</td><td>'+esc(l?.school_name||'')+'</td><td>'+esc(s?.section||'')+'</td><td>'+ (a.period==='morning'?'Manhã':'Tarde')+'</td><td>'+esc(r?.full_name||'')+'</td></tr>'}).join('');shell('Relatórios','Resumo e exportação dos cadastros','<div class="card"><div class="actions" style="justify-content:space-between"><div><h2>Cadastros</h2><p class="muted">Dados organizados por escola, zona, sessão e período.</p></div><button class="btn primary" onclick="csv()">⇩ Baixar CSV</button></div><br><div class="table"><table><tr><th>Nome</th><th>Telefone</th><th>Zona</th><th>Colégio</th><th>Sessão</th><th>Período</th><th>Pesquisador</th></tr>'+rows+'</table></div></div>','relatorios')}
function csv(){let rows=[['Nome','Telefone','Zona','Colégio','Sessão','Período','Pesquisador'],...data.assignments.map(a=>{let s=data.sections.find(x=>x.id===a.section_id),l=data.locations.find(x=>x.id===s?.polling_location_id),r=data.researchers.find(x=>x.id===a.researcher_id);return [a.person_name,a.phone||'',l?.zone||s?.zone||'',l?.school_name||'',s?.section||'',a.period==='morning'?'Manhã':'Tarde',r?.full_name||'']})];let text=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));a.download='pesquisa-2-0.csv';a.click()}
function pesquisadores(){let rows=(data.researchers||[]).map(r=>'<tr><td>'+esc(r.full_name)+'</td><td>'+esc(r.phone||'')+'</td><td>'+esc(data.sectors.find(s=>s.id===r.sector_id)?.name||'')+'</td></tr>').join('');shell('Pesquisadores','Acessos individuais vinculados ao setor','<div class="grid two"><div class="card"><h2>Novo pesquisador</h2><div id="rm"></div><div class="formgrid"><div class="field"><label>Nome</label><input id="rn"></div><div class="field"><label>Telefone</label><input id="rp"></div><div class="field"><label>Setor</label><select id="rs">'+data.sectors.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></div></div><br><button class="btn primary" onclick="createR()">Criar acesso</button></div><div class="card"><h2>Pesquisadores</h2><div class="table"><table><tr><th>Nome</th><th>Telefone</th><th>Setor</th></tr>'+rows+'</table></div></div></div>','pesquisadores')}
async function createR(){try{let j=await api('create_link',{role:'researcher',display_name:$("rn").value,sector_id:$("rs").value});let u=location.origin+location.pathname+'?access='+encodeURIComponent(j.link_token);let wa='https://wa.me/?text='+encodeURIComponent('Acesso Pesquisa 2.0\n'+u+'\nSenha inicial: 1234');$("rm").innerHTML='<div class="notice ok">Acesso criado.<br><small>'+esc(u)+'</small><br><br><a class="btn success" href="'+wa+'" target="_blank">Enviar pelo WhatsApp</a></div>';await load()}catch(e){$("rm").innerHTML='<div class="notice err">'+esc(e.message)+'</div>'}}
function diretoria(){let rows=data.sectors.map(s=>{let loc=data.locations.filter(l=>l.sector_id===s.id),ids=new Set(data.sections.filter(x=>loc.some(l=>l.id===x.polling_location_id)).map(x=>x.id)),n=data.assignments.filter(a=>ids.has(a.section_id)).length;return '<tr><td>'+esc(s.name)+'</td><td>'+ids.size+'</td><td>'+n+'</td><td><button class="btn" onclick="setor(\''+s.id+'\')">Abrir setor</button></td></tr>'}).join('');shell('Diretoria','Visão consolidada e detalhada','<div class="grid kpis">'+k('Cadastros',data.assignments.length,'✓')+k('Setores',data.sectors.length,'▦')+k('Escolas',data.locations.length,'⌂')+k('Sessões',data.sections.length,'◉')+'</div><br><div class="card"><div class="actions" style="justify-content:space-between"><div><h2>Por setor</h2><p class="muted">Abra para ver escola, zona, sessão, período e pesquisador.</p></div><button class="btn primary" onclick="csv()">⇩ Consolidado</button></div><br><div class="table"><table><tr><th>Setor</th><th>Sessões</th><th>Cadastros</th><th>Detalhes</th></tr>'+rows+'</table></div></div>','diretoria')}
function importar(){shell('Importar base','Excel/CSV com zonas, escolas e sessões','<div class="grid two"><div class="card"><h2>Arquivo</h2><div id="im"></div><input id="file" type="file" accept=".xlsx,.xls,.csv,.txt"><br><br><button class="btn primary" onclick="imp()">⇧ Ler e importar</button></div><div class="card"><h2>Formato</h2><div class="notice">Colunas: <b>zona, colegio/escola, sessao, setor</b>.<br>Uma linha por sessão. Duplicações são ignoradas.</div></div></div>','importar')}
async function imp(){try{let f=$("file").files[0];if(!f)throw Error('Selecione o arquivo.');let rows=[];if(/\.csv$|\.txt$/i.test(f.name)){let lines=(await f.text()).split(/\r?\n/).filter(Boolean),h=lines.shift().split(/[;,\t]/).map(x=>x.trim().toLowerCase());for(let line of lines){let v=line.split(/[;,\t]/),o={};h.forEach((x,i)=>o[x]=v[i]||'');rows.push({zone:o.zona||o.zone||'',school:o.colegio||o.escola||o.school||'',section:o.sessao||o.secao||o.section||'',sector:o.setor||o.sector||''})}}else{await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});rows=a.map(o=>({zone:o.zona||o.zone||'',school:o.colegio||o.escola||o.school||'',section:o.sessao||o.secao||o.section||'',sector:o.setor||o.sector||''}))}let g={};for(let r of rows){let key=r.school+'|'+r.zone+'|'+r.sector;(g[key]??={...r,sections:[]}).sections.push(r.section)}let j=await api('import_database',{rows:Object.values(g)});await load();$("im").innerHTML='<div class="notice ok">Importação concluída: '+j.schools+' escola(s), '+j.sections+' sessão(ões).</div>'}catch(e){$("im").innerHTML='<div class="notice err">'+esc(e.message)+'</div>'}}
function entrevista(){shell('Entrevista','Cadastro em campo','<div class="card"><h2>Pesquisa de campo</h2><p class="muted">Registre o entrevistado conforme o setor e a sessão atribuída ao pesquisador.</p><div id="em"></div><div class="formgrid"><div class="field"><label>Nome</label><input id="en"></div><div class="field"><label>Telefone</label><input id="ep"></div><div class="field"><label>Sessão</label><select id="es">'+data.sections.map(s=>'<option value="'+s.id+'">'+esc(s.section)+'</option>').join('')+'</select></div><div class="field"><label>Período</label><select id="et"><option value="morning">Manhã</option><option value="afternoon">Tarde</option></select></div></div><br><button class="btn primary" onclick="createA()">Registrar</button></div>','entrevista')}
function logout(){localStorage.removeItem('p20_session');localStorage.removeItem('p20_access');location.reload()}
if(!token)document.body.innerHTML='<div class="login"><div class="loginbox"><div class="logo">P2</div><h1>Pesquisa 2.0</h1><div class="notice">Este endereço precisa ser aberto pelo link de acesso enviado pelo administrador.</div></div></div>';else if(session&&access){load().then(()=>render('dashboard')).catch(login)}else login();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
