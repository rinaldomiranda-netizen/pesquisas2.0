<style>
:root{--nav:#0b1f3a;--accent:#2f7cf6;--bg:#f3f6fb;--card:#fff;--text:#172235;--muted:#718096;--line:#e3e9f2;--ok:#168a52;--danger:#d64545}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.app{display:flex;min-height:100vh}.side{width:250px;background:linear-gradient(180deg,var(--nav),#07172c);color:#fff;position:fixed;inset:0 auto 0 0;padding:16px 12px;z-index:20;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:8px 8px 20px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#3f8cff,#69a8ff);display:grid;place-items:center;font-weight:900;flex:none}.brand small{display:block;color:#9db0c9;font-size:11px}.menu-toggle{display:none;margin-left:auto;background:#ffffff18;color:#fff;border:0;border-radius:9px;padding:8px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#cbd7e8;text-align:left;border:0;padding:12px;border-radius:11px;font-size:14px;cursor:pointer}.nav button:hover,.nav button.active{background:#ffffff19;color:#fff}.main{margin-left:250px;flex:1;min-width:0}.top{min-height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 24px;position:sticky;top:0;z-index:10}.top h1{margin:0;font-size:20px}.top p{margin:3px 0 0;color:var(--muted);font-size:12px}.content{padding:22px;max-width:1450px;margin:auto}.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 25px #1027440d}.kpi{display:flex;justify-content:space-between}.value{font-size:30px;font-weight:850;margin-top:5px}.muted{color:var(--muted)}.btn{border:0;border-radius:10px;padding:10px 14px;background:#edf2f8;color:#243650;cursor:pointer}.btn:hover{filter:brightness(.98)}.primary{background:var(--accent);color:#fff}.success{background:#eaf8f1;color:#147347}.danger{background:#fff0f0;color:#a42f2f}.small{padding:7px 9px;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d6dfeb;border-radius:10px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--accent)}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}.table table{width:100%;min-width:680px;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}.table th{background:#f8fafc;color:#596a82;white-space:nowrap}.table tr:last-child td{border-bottom:0}.tag{padding:4px 8px;border-radius:99px;background:#eef4ff;color:#245aa8;font-size:11px;white-space:nowrap}.tag.ok{background:#eaf8f1;color:#147347}.notice{padding:12px;border-radius:10px;background:#f7f9fc;border:1px solid var(--line);font-size:13px}.notice.ok{background:#eaf8f1;border-color:#bfe8d2}.notice.err{background:#fff0f0;border-color:#ffd0d0;color:#a42f2f}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 60px #10274418}.loginbox h1{text-align:center}.loginbox .logo{margin:auto}.loginbox .field{margin-top:18px}.empty{padding:25px;text-align:center;color:var(--muted)}a.btn{text-decoration:none;display:inline-block}
@media(max-width:900px){.side{width:78px}.brand{justify-content:center}.brand>div:not(.logo){display:none}.nav button span{display:none}.nav button{text-align:center;font-size:19px}.main{margin-left:78px}.content{padding:15px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.top{padding:11px 14px}.top .hint{display:none}.top .actions .btn:not(.primary){display:none}}
@media(max-width:620px){.side{width:0;padding:0;overflow:visible;background:transparent}.side.open{width:250px;padding:14px 12px;background:linear-gradient(180deg,var(--nav),#07172c)}.side.open .brand>div:not(.logo),.side.open .nav button span{display:block}.side.open .nav button{text-align:left;font-size:14px}.side.open .menu-toggle{display:block}.menu-toggle{display:block;position:fixed;left:9px;top:12px;z-index:30}.main{margin-left:0}.top{padding-left:55px}.content{padding:11px}.kpis{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.card{padding:14px}.top h1{font-size:17px}.top p{font-size:11px}.top .tag{display:none}.top .actions .primary{padding:8px 10px;font-size:12px}.table table{min-width:620px}}

<body><div id="app"></div>
<script>
const API="https://oqqksddzwrlkqnfpfshu.supabase.co/functions/v1/field-access";
let token=new URLSearchParams(location.search).get("access")||"",session=localStorage.p20_session||"",access=JSON.parse(localStorage.p20_access||"null"),data={locations:[],sections:[],assignments:[],researchers:[],sectors:[]},deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;document.dispatchEvent(new Event("p20-install-ready"))});
const $=id=>document.getElementById(id),esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const wa=t=>"https://wa.me/?text="+encodeURIComponent(t);
async function api(action,body={},auth=true){const h={"Content-Type":"application/json"};if(auth&&session)h["x-field-session"]=session;const endpoint=(action==="import_database"||action==="list_imported_base")?"https://oqqksddzwrlkqnfpfshu.supabase.co/functions/v1/field-import":API;const r=await fetch(endpoint,{method:"POST",headers:h,cache:"no-store",body:JSON.stringify({action,...body,_v:Date.now()})});const ct=r.headers.get("content-type")||"";let j={};if(!ct.includes("application/json"))throw Error("O servidor retornou uma resposta inválida. Atualize a página e tente novamente.");try{j=await r.json()}catch{throw Error("O servidor retornou JSON inválido.")}if(!r.ok)throw Error(j.error||"Erro no servidor");return j}
async function load(){data=await api("list_data",{});if(access?.role==="admin"){try{data.links=(await api("list_links")).links||[]}catch{data.links=[]}try{data.importedBase=(await api("list_imported_base")).rows||[]}catch{data.importedBase=[]}}}
function login(){document.body.innerHTML='<div class="login"><div class="loginbox"><div class="logo">P2</div><h1>Pesquisa 2.0</h1><p class="muted" style="text-align:center">Acesso seguro à pesquisa de campo</p><div id="lm"></div><div class="field"><label>Senha de acesso</label><input id="pw" type="password" value="1234"></div><br><button class="btn primary" style="width:100%" onclick="enter()">Entrar</button></div></div>';$("pw")?.addEventListener("keydown",e=>{if(e.key==="Enter")enter()})}
async function enter(){try{let j=await api("login",{link_token:token,password:$("pw").value},false);session=j.session_token;access=j.access;localStorage.p20_session=session;localStorage.p20_access=JSON.stringify(access);localStorage.p20_link_token=token;if(access.role==="director")localStorage.p20_director_access=token;await load();goHome()}catch(e){$("lm").innerHTML='<div class="notice err">'+esc(e.message)+"</div>"}}
function goHome(){if(access?.role==="researcher")render("entrevista");else if(access?.role==="director")render("diretoria");else render("dashboard")}
function k(t,v,i){return '<div class="card kpi"><div><div class="muted">'+t+'</div><div class="value">'+v+'</div></div><div style="font-size:24px">'+i+'</div></div>'}
function shell(title,sub,body,active){const role=access?.role||"",label=role==="admin"?"Administrador":role==="director"?"Diretoria":"Pesquisador";let nav="";
if(role==="admin")nav='<button class="'+(active==="dashboard"?"active":"")+'" onclick="render(\'dashboard\')">▦ <span>Dashboard</span></button><button class="'+(active==="cadastro"?"active":"")+'" onclick="render(\'cadastro\')">＋ <span>Novo cadastro</span></button><button class="'+(active==="setores"?"active":"")+'" onclick="render(\'setores\')">◉ <span>Setores e sessões</span></button><button class="'+(active==="relatorios"?"active":"")+'" onclick="render(\'relatorios\')">▤ <span>Relatórios</span></button><button class="'+(active==="pesquisadores"?"active":"")+'" onclick="render(\'pesquisadores\')">♙ <span>Pesquisadores</span></button><button class="'+(active==="diretoria"?"active":"")+'" onclick="render(\'diretoria\')">⌂ <span>Diretoria</span></button><button class="'+(active==="importar"?"active":"")+'" onclick="render(\'importar\')">⇧ <span>Importar base</span></button>';
else if(role==="director")nav='<button class="active" onclick="render(\'diretoria\')">⌂ <span>Diretoria</span></button><button onclick="render(\'relatorios\')">▤ <span>Relatórios</span></button>';
else nav='<button class="active" onclick="render(\'entrevista\')">✓ <span>Entrevista</span></button>';
document.body.innerHTML='<div class="app"><aside class="side"><div class="brand"><div class="logo">P2</div><div><b>Pesquisa 2.0</b><small>Pesquisa de campo</small></div><button class="menu-toggle" type="button" aria-label="Abrir menu" onclick="this.closest(\'.side\').classList.toggle(\'open\')">☰</button></div><nav class="nav">'+nav+'</nav><div style="margin-top:25px"><button class="nav button" onclick="logout()">↪ <span>Sair</span></button></div></aside><main class="main"><header class="top"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions"><span class="tag">'+label+'</span><button class="btn" onclick="load().then(()=>render(\''+active+'\'))">↻ Atualizar</button><button class="btn primary" onclick="installApp()">▣ Instalar '+label+'</button></div></header><section class="content">'+body+'</section></main></div>'}
function installApp(){if(window.parent!==window&&typeof window.parent.__p20Install==="function"){window.parent.__p20Install();return}if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.finally(()=>deferredInstallPrompt=null);return}alert("Abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela de início”.")}
function render(p){document.querySelector(".side")?.classList.remove("open");if(p==='dashboard')return dashboard();if(p==='cadastro')return cadastro();if(p==='setores')return setores();if(p==='relatorios')return relatorios();if(p==='pesquisadores')return pesquisadores();if(p==='diretoria')return diretoria();if(p==='importar')return importar();if(p==='entrevista')return entrevista()}
function dashboard(){shell('Dashboard','Visão geral da operação de campo','<div class="grid kpis">'+k('Cadastros',data.assignments.length,'✓')+k('Setores',data.sectors.length,'▦')+k('Escolas',data.locations.length,'⌂')+k('Sessões',data.sections.length,'◉')+'</div><br><div class="grid two"><div class="card"><h2>Pesquisa 2.0</h2><p class="muted">Gestão de pesquisadores, escolas, zonas e sessões.</p><br><div class="actions"><button class="btn primary" onclick="render(\'cadastro\')">＋ Novo cadastro</button><button class="btn" onclick="render(\'setores\')">Abrir setores e sessões</button></div></div><div class="card"><h2>Regra de alocação</h2><p>Máximo de <b>2 pessoas por sessão</b>: uma no período da manhã e uma no período da tarde.</p></div></div>','dashboard')}
function cadastro(){
const sections=data.sections||[],role=access?.role||"admin";
const opts=sections.map(s=>{const l=data.locations.find(x=>x.id===s.polling_location_id);return '<option value="'+esc(s.id)+'" data-zona="'+esc(l?.zone||s.zone||'')+'" data-escola="'+esc(l?.school_name||'')+'" data-sessao="'+esc(s.section)+'">'+esc(s.section)+' — Zona '+esc(l?.zone||s.zone||'')+' — '+esc(l?.school_name||'')+'</option>'}).join('');
const researchers=(role==="admin"||role==="researcher")?(data.researchers||[]).map(r=>'<option value="'+esc(r.id)+'" data-sector="'+esc(r.sector_id||'')+'">'+esc(r.full_name)+' — '+esc(data.sectors.find(s=>s.id===r.sector_id)?.name||'')+'</option>').join(""):"";
const researcherField=(role==="admin"||role==="researcher")?'<div class="field"><label>Pesquisador responsável *</label><select id="cr"><option value="">Selecione o pesquisador</option>'+researchers+'</select><small class="muted">'+(role==="admin"?"O administrador pode escolher qualquer pesquisador cadastrado.":"Você pode escolher somente pesquisadores do seu setor.")+'</small></div>':"";
shell('Novo cadastro','Use Sessão, Zona ou Escola para localizar. Depois clique no resultado: os três campos serão preenchidos automaticamente.','<div class="card"><div id="cm"></div><div class="formgrid"><div class="field"><label>Nome da pessoa *</label><input id="cn" placeholder="Nome completo"></div><div class="field"><label>Telefone</label><input id="cp" inputmode="tel" placeholder="Telefone"></div><div class="field"><label>Buscar sessão</label><input id="csBusca" inputmode="text" placeholder="Ex.: 103" oninput="filterSections()"></div><div class="field"><label>Buscar zona</label><input id="cz" placeholder="Ex.: 3" oninput="filterSections()"></div><div class="field"><label>Buscar escola</label><input id="ce" placeholder="Digite parte do nome" oninput="filterSections()"></div><div class="field"><label>Resultado — clique para selecionar a sessão *</label><select id="cs" size="6" onchange="selectSectionOption()">'+opts+'</select><small class="muted">Sessão é obrigatória para cadastrar. Zona e escola são apenas filtros para encontrar a sessão.</small></div><div class="field"><label>Período *</label><select id="ct"><option value="morning">Manhã</option><option value="afternoon">Tarde</option></select></div>'+researcherField+'</div><br><button class="btn primary" onclick="createA()">Cadastrar</button></div>','cadastro');
filterSections();
}
function filterSections(){
const sel=$("cs");if(!sel)return;
const session=($("csBusca")?.value||"").trim().toLowerCase(),zone=($("cz")?.value||"").trim().toLowerCase(),school=($("ce")?.value||"").trim().toLowerCase();
[...sel.options].forEach(o=>{const ok=(!session||String(o.dataset.sessao||"").toLowerCase().includes(session))&&(!zone||String(o.dataset.zona||"").toLowerCase().includes(zone))&&(!school||String(o.dataset.escola||"").toLowerCase().includes(school));o.hidden=!ok});
syncResearchers();
}
function selectSectionOption(){
const sel=$("cs");const o=sel?.selectedOptions?.[0];if(!o)return;
$("csBusca").value=o.dataset.sessao||"";
$("cz").value=o.dataset.zona||"";
$("ce").value=o.dataset.escola||"";
filterSections();
const selected=[...sel.options].find(x=>x.value===o.value);if(selected)selected.hidden=false;
syncResearchers();
}
function syncResearchers(){
const st=stateForCadastro(),rs=$("cr");if(!rs)return;
const current=rs.value;
if(st.role==="admin"){
  [...rs.options].forEach(o=>o.hidden=false);
  if(current&&[...rs.options].some(o=>o.value===current&&!o.hidden))rs.value=current;
  return;
}
if(st.role!=="researcher")return;
const myAccess=st.access?.id||access?.id||"",mine=(st.data.researchers||[]).find(r=>r.access_link_id===myAccess);
let first="";
[...rs.options].forEach((o,i)=>{if(i===0)return;const ok=true;o.hidden=!ok;if(!first)first=o.value});
if(mine&&[...rs.options].some(o=>o.value===mine.id&&!o.hidden))rs.value=mine.id;
else if(current&&[...rs.options].some(o=>o.value===current&&!o.hidden))rs.value=current;
else if(first)rs.value=first;
}
function stateForCadastro(){const st=window.p20State?window.p20State():null;return st?{data:st.data,role:st.access?.role||"",access:st.access||null}:{data,role:access?.role||"",access};}
async function createA(){
try{
const name=$("cn").value.trim(),phone=$("cp").value.trim(),sid=$("cs").value,period=$("ct").value,st=stateForCadastro();
if(!name)throw Error("Informe o nome da pessoa.");
if(!sid)throw Error("Selecione uma sessão no resultado da busca.");
if((st.role==="admin"||st.role==="researcher")&&!$("cr")?.value)throw Error("Selecione o pesquisador responsável.");
const body={person_name:name,phone,section_id:sid,period};
if(st.role==="admin"||st.role==="researcher")body.researcher_id=$("cr").value;
await api("create_assignment",body);
await load();
$("cm").innerHTML='<div class="notice ok">Cadastro realizado com sucesso.</div>';
if(st.role==="admin")render("cadastro");
}catch(e){$("cm").innerHTML='<div class="notice err">'+esc(e.message)+'</div>'}
}
function setores(){let rows=(data.sectors||[]).map(s=>{let loc=data.locations.filter(l=>l.sector_id===s.id),ids=data.sections.filter(x=>loc.some(l=>l.id===x.polling_location_id));return '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.code||'')+'</td><td>'+loc.length+'</td><td>'+ids.length+'</td><td><button class="btn small" onclick="setor(\''+esc(s.id)+'\')">Abrir</button> <button class="btn danger small" onclick="deleteSector(\''+esc(s.id)+'\')">Excluir</button></td></tr>'}).join('');shell('Setores e sessões','Cadastre e gerencie os setores da pesquisa','<div class="grid two"><div class="card"><h2>Novo setor</h2><div id="sm"></div><div class="formgrid"><div class="field"><label>Nome do setor</label><input id="sn" placeholder="Ex.: Setor Norte"></div><div class="field"><label>Código do setor</label><input id="sc" placeholder="Ex.: N01"></div></div><br><button class="btn primary" onclick="createSector()">＋ Adicionar setor</button></div><div class="card"><h2>Setores cadastrados</h2><div class="table"><table><tr><th>Setor</th><th>Código</th><th>Escolas</th><th>Sessões</th><th>Ações</th></tr>'+rows+'</table></div></div></div>','setores')}
async function createSector(){try{let name=$("sn").value.trim(),code=$("sc").value.trim();if(!name)throw Error("Informe o nome do setor.");await api("create_sector",{name,code});await load();render("setores")}catch(e){$("sm").innerHTML='<div class="notice err">'+esc(e.message)+'</div>'}}
async function deleteSector(id){if(!confirm("Excluir este setor e os dados vinculados a ele?"))return;try{await api("delete_sector",{id});await load();render("setores")}catch(e){alert(e.message||"Não foi possível excluir o setor.")}}
function setor(id){let s=data.sectors.find(x=>x.id===id),loc=data.locations.filter(l=>l.sector_id===id),ids=new Set(data.sections.filter(x=>loc.some(l=>l.id===x.polling_location_id)).map(x=>x.id)),rows=data.assignments.filter(a=>ids.has(a.section_id)).map(a=>{let sec=data.sections.find(x=>x.id===a.section_id),l=data.locations.find(x=>x.id===sec?.polling_location_id),r=data.researchers.find(x=>x.id===a.researcher_id);return '<tr><td>'+esc(l?.school_name||'')+'</td><td>'+esc(l?.zone||'')+'</td><td>'+esc(sec?.section||'')+'</td><td>'+esc(a.person_name)+'</td><td>'+esc(a.phone||'')+'</td><td>'+esc(a.period==='morning'?'Manhã':'Tarde')+'</td><td>'+esc(r?.full_name||'')+'</td><td><button class="btn danger small" onclick="deleteAssignment(\''+esc(a.id)+'\')">Excluir</button></td></tr>'}).join('');shell('Setor '+esc(s?.name||''),'Detalhamento do setor','<div class="card"><button class="btn" onclick="render(\'setores\')">← Voltar</button><br><br><div class="table"><table><tr><th>Colégio</th><th>Zona</th><th>Sessão</th><th>Nome</th><th>Telefone</th><th>Período</th><th>Pesquisador</th><th>Ações</th></tr>'+rows+'</table></div></div>','setores')}
async function deleteAssignment(id){if(!confirm("Excluir este cadastro?"))return;try{await api("delete_assignment",{id});await load();render("setores")}catch(e){alert(e.message||"A exclusão de cadastro ainda não está disponível no backend.")}}
function relatorios(){let rows=data.assignments.map(a=>{let s=data.sections.find(x=>x.id===a.section_id),l=data.locations.find(x=>x.id===s?.polling_location_id),r=data.researchers.find(x=>x.id===a.researcher_id);return '<tr><td>'+esc(a.person_name)+'</td><td>'+esc(a.phone||'')+'</td><td>'+esc(l?.zone||s?.zone||'')+'</td><td>'+esc(l?.school_name||'')+'</td><td>'+esc(s?.section||'')+'</td><td>'+esc(a.period==='morning'?'Manhã':'Tarde')+'</td><td>'+esc(r?.full_name||'')+'</td><td><button class="btn danger small" onclick="deleteAssignment(\''+esc(a.id)+'\')">Excluir</button></td></tr>'}).join('');shell('Relatórios','Resumo e exportação dos cadastros','<div class="card"><div class="actions" style="justify-content:space-between"><div><h2>Cadastros</h2><p class="muted">Dados organizados por escola, zona, sessão e período.</p></div><button class="btn primary" onclick="csv()">⇩ Baixar CSV</button></div><br><div class="table"><table><tr><th>Nome</th><th>Telefone</th><th>Zona</th><th>Colégio</th><th>Sessão</th><th>Período</th><th>Pesquisador</th><th>Ações</th></tr>'+rows+'</table></div></div>','relatorios')}
function csv(){let rows=[['Nome','Telefone','Zona','Colégio','Sessão','Período','Pesquisador'],...data.assignments.map(a=>{let s=data.sections.find(x=>x.id===a.section_id),l=data.locations.find(x=>x.id===s?.polling_location_id),r=data.researchers.find(x=>x.id===a.researcher_id);return [a.person_name,a.phone||'',l?.zone||s?.zone||'',l?.school_name||'',s?.section||'',a.period==='morning'?'Manhã':'Tarde',r?.full_name||'']})];let text=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));a.download='pesquisa-2-0.csv';a.click()}
function researcherLink(r){const saved=JSON.parse(localStorage.getItem('p20_researcher_links')||'{}');return r.access_url||saved[r.id]?.url||saved[(r.full_name||'').toLowerCase()+'|'+r.sector_id]?.url||''}
function linkActions(u,label){if(!u)return '<span class="muted">Link não disponível</span>';return '<div class="actions"><button class="btn small" onclick="copyLink('+JSON.stringify(u)+')">Copiar link</button><a class="btn success small" href="'+wa('Acesso Pesquisa 2.0 — '+label+'\n'+u+'\nSenha inicial: 1234')+'" target="_blank" rel="noopener">WhatsApp</a></div>'}
async function copyLink(u){try{await navigator.clipboard.writeText(u);alert("Link copiado.")}catch{prompt("Copie o link:",u)}}
function pesquisadores(){const saved=JSON.parse(localStorage.getItem('p20_researcher_links')||'{}');let rows=(data.researchers||[]).map(r=>{let sec=data.sectors.find(s=>s.id===r.sector_id),u=researcherLink(r);return '<tr><td>'+esc(r.full_name)+'</td><td>'+esc(r.phone||saved[r.id]?.phone||'')+'</td><td>'+esc(sec?.name||'')+'</td><td>'+linkActions(u,'Pesquisador')+'</td><td><button class="btn danger small" onclick="deleteResearcher(\''+esc(r.id)+'\')">Excluir</button></td></tr>'}).join('');shell('Pesquisadores','Acessos individuais por setor','<div class="grid two"><div class="card"><h2>Novo pesquisador</h2><div id="rm"></div><div class="formgrid"><div class="field"><label>Nome</label><input id="rn"></div><div class="field"><label>Telefone</label><input id="rp" inputmode="tel"></div><div class="field"><label>Setor</label><select id="rs">'+data.sectors.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join('')+'</select></div></div><br><button id="crb" class="btn primary" onclick="createR()">Criar acesso de pesquisador</button></div><div class="card"><h2>Pesquisadores cadastrados</h2><div class="table"><table><tr><th>Nome</th><th>Telefone</th><th>Setor</th><th>Link</th><th>Ações</th></tr>'+rows+'</table></div></div></div>','pesquisadores')}
async function createR(){const b=$("crb"),name=$("rn").value.trim(),phone=$("rp").value.trim(),sector=$("rs").value;if(!name)return $("rm").innerHTML='<div class="notice err">Informe o nome do pesquisador.</div>';if(b)b.disabled=true;try{let j=await api('create_link',{role:'researcher',display_name:name,sector_id:sector,phone});let u=j.url||location.origin+location.pathname+'?access='+encodeURIComponent(j.link_token);let saved=JSON.parse(localStorage.getItem('p20_researcher_links')||'{}');let item={url:u,phone};saved[name.toLowerCase()+'|'+sector]=item;if(j.access?.id)saved[j.access.id]=item;localStorage.setItem('p20_researcher_links',JSON.stringify(saved));$("rm").innerHTML='<div class="notice ok"><b>✓ Acesso criado.</b><br><small>'+esc(u)+'</small><br><br>'+linkActions(u,'Pesquisador')+'</div>';await load();render('pesquisadores')}catch(e){$("rm").innerHTML='<div class="notice err">'+esc(e.message)+'</div>'}finally{if(b)b.disabled=false}}
async function deleteResearcher(id){if(!confirm("Excluir este pesquisador, revogar o acesso e remover as alocações dele?"))return;try{await api("delete_researcher",{id});await load();render("pesquisadores")}catch(e){alert(e.message||"Não foi possível excluir o pesquisador.")}}
function diretorioRows(){return data.sectors.map(s=>{let loc=data.locations.filter(l=>l.sector_id===s.id),ids=new Set(data.sections.filter(x=>loc.some(l=>l.id===x.polling_location_id)).map(x=>x.id)),n=data.assignments.filter(a=>ids.has(a.section_id)).length;return '<tr><td>'+esc(s.name)+'</td><td>'+ids.size+'</td><td>'+n+'</td><td><button class="btn small" onclick="setor(\''+esc(s.id)+'\')">Abrir setor</button></td></tr>'}).join('')}
function diretoria(){let create=access?.role==='admin'?'<div class="card"><h2>Gerar acesso da diretoria</h2><p class="muted">O link possui identidade própria de diretoria e permanece utilizável.</p><div id="dm"></div><div class="field"><label>Nome</label><input id="dn" placeholder="Nome da diretoria"></div><br><button class="btn primary" onclick="createD()">Criar acesso da diretoria</button></div>':'<div class="card"><h2>Acesso da Diretoria</h2><p class="muted">Visão consolidada da operação de campo.</p><div class="notice ok">Este acesso está identificado como <b>Diretoria</b>.</div></div>';shell('Diretoria','Visão consolidada da operação de campo','<div class="grid kpis">'+k('Cadastros',data.assignments.length,'✓')+k('Setores',data.sectors.length,'▦')+k('Escolas',data.locations.length,'⌂')+k('Sessões',data.sections.length,'◉')+'</div><br><div class="grid two">'+create+'<div class="card"><h2>Aplicativo por função</h2><p class="muted">O botão Instalar usa a instalação da página externa quando a Diretoria estiver em diretoria.html.</p><div class="actions"><button class="btn" onclick="installApp()">▣ Instalar Diretoria</button></div></div></div><br><div class="card"><div class="actions" style="justify-content:space-between"><div><h2>Consolidado por setor</h2><p class="muted">Abra para ver escola, zona, sessão, período e pesquisador.</p></div><button class="btn primary" onclick="csv()">⇩ Consolidado CSV</button></div><br><div class="table"><table><tr><th>Setor</th><th>Sessões</th><th>Cadastros</th><th>Detalhes</th></tr>'+diretorioRows()+'</table></div></div>','diretoria')}
async function createD(){try{let name=$("dn").value.trim();if(!name)throw Error("Informe o nome da diretoria.");let j=await api('create_link',{role:'director',display_name:name});let u=j.url||location.origin+location.pathname+'?access='+encodeURIComponent(j.link_token);let saved=JSON.parse(localStorage.getItem('p20_director_links')||'[]');saved.push({url:u,name,created_at:new Date().toISOString()});localStorage.setItem('p20_director_links',JSON.stringify(saved));$("dm").innerHTML='<div class="notice ok"><b>✓ Acesso de diretoria criado.</b><br><small>'+esc(u)+'</small><br><br>'+linkActions(u,'Diretoria')+'</div>'}catch(e){$("dm").innerHTML='<div class="notice err">'+esc(e.message)+'</div>'}}
function importar(){const base=data.importedBase||[];const rows=base.map(r=>'<tr><td>'+esc(r.row_number)+'</td><td>'+esc(r.person_name||'')+'</td><td>'+esc(r.phone||'')+'</td><td>'+esc(r.zone||'')+'</td><td>'+esc(r.school_name||'')+'</td><td>'+esc(r.section||'')+'</td><td>'+esc(r.sector||'')+'</td></tr>').join('');const persisted='<div class="card"><h2>Base salva no sistema</h2><p class="muted">Esta é a base original importada do Excel, gravada no Supabase. Ela permanece disponível depois de trocar de menu.</p>'+(rows?'<div class="table"><table><tr><th>#</th><th>Nome</th><th>Telefone</th><th>Zona</th><th>Escola</th><th>Seção</th><th>Setor</th></tr>'+rows+'</table></div>':'<div class="notice">Nenhuma base de Excel foi gravada ainda.</div>')+'</div>';shell('Importar base','Excel/CSV — a base importada fica salva no sistema','<div class="card"><h2>Arquivo</h2><div id="im"></div><input id="file" type="file" accept=".xlsx,.xls,.csv,.txt"><br><br><div class="actions"><button class="btn primary" onclick="imp()">⇧ Ler e importar</button><button class="btn danger" onclick="cancelImport()">Cancelar / limpar</button><button class="btn" onclick="refreshActive(\'importar\')">↻ Atualizar base</button></div><p class="muted" style="font-size:12px;margin-top:8px">Depois de importar, saia desta tela e volte: a tabela abaixo será carregada do banco.</p></div><div class="card"><h2>Formato aceito</h2><div class="notice">Aceita nomes como <b>Zona Eleitoral</b>, <b>Local de Votação / Escola</b>, <b>Seção</b>, <b>Nome da Pessoa</b> e <b>Telefone</b>. A coluna Setor é opcional.</div><div id="ip"></div></div><br>'+persisted,'importar')}function cancelImport(){$("file")&&($("file").value='');if($("ip"))$("ip").innerHTML='';if($("im"))$("im").innerHTML='<div class="notice">Importação cancelada. A base já gravada permanece.</div>'}function norm(x){return String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}function pick(o,names){for(const n of names){const v=o[norm(n)];if(v!==undefined&&String(v).trim()!=='')return v}return ''}function renderImportPreview(rows,title){const view=rows.slice(0,30).map(r=>'<tr><td>'+esc(r.name||'')+'</td><td>'+esc(r.phone||'')+'</td><td>'+esc(r.zone||'')+'</td><td>'+esc(r.school||'')+'</td><td>'+esc(r.section||'')+'</td><td>'+esc(r.sector||'')+'</td></tr>').join('');$("ip").innerHTML='<br><h3 style="margin:0 0 8px">'+esc(title)+' — '+rows.length+' linha(s)</h3><div class="table"><table><tr><th>Nome</th><th>Telefone</th><th>Zona</th><th>Escola</th><th>Seção</th><th>Setor</th></tr>'+view+'</table></div>'+(rows.length>30?'<p class="muted" style="font-size:11px">Prévia limitada às primeiras 30 linhas.</p>':'')}async function imp(){try{const f=$("file").files[0];if(!f)throw Error('Selecione o arquivo.');let rows=[];if(/\.csv$|\.txt$/i.test(f.name)){const lines=(await f.text()).split(/\r?\n/).filter(Boolean);if(!lines.length)throw Error('Arquivo vazio.');const h=lines.shift().split(/[;,\t]/).map(norm);for(const line of lines){const v=line.split(/[;,\t]/),o={};h.forEach((x,i)=>o[x]=v[i]??'');rows.push({name:pick(o,['nome','nomedapessoa','nomepessoa','pessoa','full_name']),phone:pick(o,['telefone','fone','phone','celular']),zone:pick(o,['zona','zone','zonadevotacao','zonaeleitoral']),school:pick(o,['colegio','escola','school','nomedocolegio','nomeescola','escoladevotacao','localdevotacaoescola','localdevotacao']),section:pick(o,['sessao','secao','section','numerodasecao','secaoeleitoral']),sector:pick(o,['setor','sector','setorpesquisa','codigosetor','numerosetor'])})}}else{await new Promise((ok,no)=>{if(window.XLSX)return ok();const sc=document.createElement('script');sc.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';sc.onload=ok;sc.onerror=()=>no(Error('Não foi possível carregar o leitor de Excel.'));document.head.appendChild(sc)});const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),arr=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});rows=arr.map(o=>{const n={};Object.keys(o).forEach(k=>n[norm(k)]=o[k]);return {name:pick(n,['nome','nomedapessoa','nomepessoa','pessoa','fullname']),phone:pick(n,['telefone','fone','phone','celular']),zone:pick(n,['zona','zone','zonadevotacao','zonaeleitoral']),school:pick(n,['colegio','escola','school','nomedocolegio','nomeescola','escoladevotacao','localdevotacaoescola','localdevotacao']),section:pick(n,['sessao','secao','section','numerodasecao','secaoeleitoral']),sector:pick(n,['setor','sector','setorpesquisa','codigosetor','numerosetor'])}})}rows=rows.filter(r=>r.name||r.phone||r.school||r.section||r.zone||r.sector);if(!rows.length)throw Error('Nenhuma linha reconhecida.');renderImportPreview(rows,'Prévia do arquivo');const grouped={};for(const r of rows){if(!r.school||!r.section)continue;const sector=r.sector||r.zone||'Sem setor',key=r.school+'|'+r.zone+'|'+sector;(grouped[key]??={zone:r.zone,school:r.school,sector,sections:[]}).sections.push(String(r.section))}const j=await api('import_database',{filename:f.name,raw_rows:rows,rows:Object.values(grouped)});await load();$("im").innerHTML='<div class="notice ok">Importação salva no banco: <b>'+j.raw_rows+' linha(s)</b> da base original, além de <b>'+j.schools+' escola(s)</b> e <b>'+j.sections+' seção(ões)</b>.</div>';render('importar')}catch(e){if($("im"))$("im").innerHTML='<div class="notice err"><b>Erro:</b> '+esc(e.message||'Falha ao importar')+'</div>'}}
function entrevista(){shell('Entrevista','Cadastro em campo','<div class="card"><h2>Pesquisa de campo</h2><p class="muted">Registre o entrevistado conforme o setor e a sessão atribuída ao pesquisador.</p><div id="em"></div><div class="formgrid"><div class="field"><label>Nome</label><input id="en"></div><div class="field"><label>Telefone</label><input id="ep" inputmode="tel"></div><div class="field"><label>Sessão</label><select id="es">'+data.sections.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.section)+'</option>').join('')+'</select></div><div class="field"><label>Período</label><select id="et"><option value="morning">Manhã</option><option value="afternoon">Tarde</option></select></div></div><br><button class="btn primary" onclick="createAFromResearcher()">Registrar</button></div>','entrevista')}
async function createAFromResearcher(){try{await api('create_assignment',{person_name:$("en").value.trim(),phone:$("ep").value.trim(),section_id:$("es").value,period:$("et").value});await load();$("em").innerHTML='<div class="notice ok">Registro realizado com sucesso.</div>'}catch(e){$("em").innerHTML='<div class="notice err">'+esc(e.message)+'</div>'}}
function logout(){localStorage.removeItem('p20_session');localStorage.removeItem('p20_access');localStorage.removeItem('p20_link_token');location.reload()}
window.p20State=()=>({data,access,session,token});
(function start(){if(token){const prev=localStorage.p20_link_token||'';if(prev!==token){session='';access=null;localStorage.removeItem('p20_session');localStorage.removeItem('p20_access')}if(session&&access)load().then(goHome).catch(login);else login()}else if(session&&access)load().then(goHome).catch(login);else document.body.innerHTML='<div class="login"><div class="loginbox"><div class="logo">P2</div><h1>Pesquisa 2.0</h1><div class="notice">Abra o link individual de acesso enviado pelo administrador.</div></div></div>'})();
