function installApp(){if(window.parent!==window&&typeof window.parent.__p20Install==="function"){window.parent.__p20Install();return}if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.finally(()=>deferredInstallPrompt=null);return}alert("Abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela de início”.")}

const researcherField=(role==="admin"||role==="researcher")?"<div class=\"field\"><label>Pesquisador responsável *</label><select id=\"cr\" onchange=\"filterSections();renderCadImportedBase();renderCadProgress()\"><option value=\"\">Selecione o pesquisador</option>"+researchers+"</select><small class=\"muted\">"+(role==="admin"?"Selecione primeiro o pesquisador: os filtros e as listas abaixo mostrarão somente o setor dele.":"Você pode escolher somente pesquisadores do seu setor.")+"</small></div>":"";

researcherField+

function filterSections(){
const sel=$("cs");if(!sel)return;
const session=($("csBusca")?.value||"").trim().toLowerCase();
const zone=($("cz")?.value||"").trim().toLowerCase();
const region=($("cg")?.value||"").trim().toLowerCase();
const city=($("cc")?.value||"").trim().toLowerCase();
const neighborhood=($("cbairro")?.value||"").trim().toLowerCase();
const address=($("cend")?.value||"").trim().toLowerCase();
const school=($("ce")?.value||"").trim().toLowerCase();
const crSel=$("cr");
const researcherSector=(crSel&&crSel.value)?String(crSel.selectedOptions?.[0]?.dataset.sector||""):null;
[...sel.options].forEach(o=>{
const matchesText=(!session||String(o.dataset.sessao||"").toLowerCase().includes(session))&&(!region||String(o.dataset.regiao||"").toLowerCase().includes(region))&&(!city||String(o.dataset.cidade||"").toLowerCase().includes(city))&&(!neighborhood||String(o.dataset.bairro||"").toLowerCase().includes(neighborhood))&&(!zone||String(o.dataset.zona||"").toLowerCase().includes(zone))&&(!address||String(o.dataset.endereco||"").toLowerCase().includes(address))&&(!school||String(o.dataset.escola||"").toLowerCase().includes(school));
const matchesSector=!crSel?true:(researcherSector===null?false:String(o.dataset.sector||"")===researcherSector);
o.hidden=!(matchesText&&matchesSector);
});
}
function renderImportedBaseTable(rows,title){

}
function renderCadImportedBase(){
const box=$("cadImportedBase");if(!box)return;
const role=access?.role||"admin";
const all=data.importedBase||[];
if(role==="researcher"){
box.innerHTML=all.length?renderImportedBaseTable(all,'Lista importada do seu setor'):'';
return;
}
if(role!=="admin"){box.innerHTML='';return}
const crSel=$("cr");
const rid=crSel?.value||"";
if(!rid){box.innerHTML='';return}
const researcher=(data.researchers||[]).find(x=>x.id===rid);
const sectorName=(data.sectors||[]).find(s=>s.id===researcher?.sector_id)?.name||"";
const rows=sectorName?all.filter(r=>String(r.sector||"").trim().toLowerCase()===sectorName.trim().toLowerCase()):[];
const label='Lista importada do setor de '+(researcher?.full_name||'')+' ('+sectorName+')';
box.innerHTML=rows.length?renderImportedBaseTable(rows,label):'<div class="notice" style="margin-top:16px">Nenhuma linha importada encontrada para o setor "'+esc(sectorName)+'".</div>';
}
function renderCadProgress(){
const box=$("cadProgress");if(!box)return;
const role=access?.role||"admin";
let researcher=null;
if(role==="researcher"){
const myAccess=access?.id||"";
researcher=(data.researchers||[]).find(r=>r.access_link_id===myAccess)||null;
}else if(role==="admin"){
const crSel=$("cr"),rid=crSel?.value||"";
researcher=(data.researchers||[]).find(x=>x.id===rid)||null;
}else{box.innerHTML='';return}
if(!researcher){box.innerHTML='';return}
const mine=(data.assignments||[]).filter(a=>a.researcher_id===researcher.id).sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
const sectorSections=role==="researcher"?(data.sections||[]).length:(data.sections||[]).filter(sec=>{const l=data.locations.find(x=>x.id===sec.polling_location_id);return l?.sector_id===researcher.sector_id}).length;
