<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1f3a"><link rel="manifest" href="./manifest-admin.webmanifest"><link rel="icon" href="./icon-admin-192.svg" type="image/svg+xml"><title>Pesquisa 2.0 — Administrador</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6fb}#app{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" title="Pesquisa 2.0 — Administrador"></iframe><script>(function(){const p=new URLSearchParams(location.search);const t=p.get('access');if(t)localStorage.setItem('p20_admin_access',t);const token=localStorage.getItem('p20_admin_access')||'';let installEvent=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e});window.__p20Install=async()=>{if(installEvent){installEvent.prompt();await installEvent.userChoice;installEvent=null}else alert('Abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela de início”.')};document.getElementById('app').src='./index.html'+(token?'?access='+encodeURIComponent(token):'')})()</script></body></html>
