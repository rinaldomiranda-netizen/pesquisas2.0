<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1f3a"><link rel="manifest" href="./manifest-admin.webmanifest"><link rel="icon" href="./icon-admin-192.svg" type="image/svg+xml"><title>Pesquisa 2.0 — Administrador</title><style>html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f6fb;color:#10233f}body{display:flex;align-items:center;justify-content:center}.card{width:min(92%,460px);box-sizing:border-box;background:#fff;border-radius:20px;padding:28px;box-shadow:0 12px 40px #0001}.logo{font-size:28px;font-weight:800}.sub{color:#66758a;margin:8px 0 22px}button{width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;background:#0b1f3a;color:#fff}.status{margin-top:16px;padding:12px;border-radius:10px;background:#f3f6fb;font-size:14px;line-height:1.45}.small{margin-top:16px;color:#718096;font-size:12px;text-align:center}</style></head><body><main class="card"><div class="logo">Pesquisa 2.0</div><div class="sub">Acesso administrativo</div><button id="entrar">Entrar como Administrador</button><div id="status" class="status">Clique para solicitar seu acesso administrativo.</div><div class="small">Acesso protegido pelo Supabase</div></main><script>(function(){const p=new URLSearchParams(location.search),t=p.get('access');if(t)localStorage.setItem('p20_admin_access',t);let installEvent=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e});window.__p20Install=async()=>{if(installEvent){installEvent.prompt();await installEvent.userChoice;installEvent=null}else alert('Abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela de início”.')};const b=document.getElementById('entrar'),s=document.getElementById('status');b.onclick=async()=>{const token=localStorage.getItem('p20_admin_access')||'';if(token){location.href='./index.html?access='+encodeURIComponent(token);return}s.textContent='Solicitando acesso administrativo…';try{const r=await fetch('https://oqqksddzwrlkqnfpfshu.supabase.co/functions/v1/admin-bootstrap',{method:'POST',headers:{'Content-Type':'application/json'}}),d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível iniciar o acesso.');s.textContent='Link de acesso enviado para o e-mail administrativo cadastrado. Abra o link recebido para entrar.'}catch(e){s.textContent=e.message||'Erro ao solicitar acesso.'}}})();</script></body></html>
