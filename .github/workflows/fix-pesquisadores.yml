name: Validar Pesquisa 2.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'fixes.js'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=[m.group(1) for m in re.finditer(r'<script>([\\s\\S]*?)</script>',html)]
          assert scripts, 'Nenhum script encontrado'
          print('index.html carregado:', len(html), 'bytes')
          js=Path('fixes.js').read_text(encoding='utf-8')
          assert 'renderPersistentBase' in js or 'Base gravada no sistema' in js
          print('fixes.js carregado:', len(js), 'bytes')
          PY
