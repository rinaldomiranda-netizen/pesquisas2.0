name: Ajustar pesquisadores
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir tela de pesquisadores
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=re.search(r"function pesquisadores\(\)\{[\s\S]*?\n\}\nasync function createR\(\)",s)
          if not old:
              raise SystemExit('Bloco pesquisadores não encontrado')
          new="""function pesquisadores(){
            const saved=JSON.parse(localStorage.getItem('p20_researcher_links')||'{}');
            let rows=(data.researchers||[]).map(r=>{let sec=data.sectors.find(s=>s.id===r.sector_id),u=r.access_url||saved[r.id]?.url||'',wa=u?'https://wa.me/?text='+encodeURIComponent('Acesso Pesquisa 2.0 — Pesquisador\\n'+u+'\\nSenha inicial: 1234'):'';return '<tr><td>'+esc(r.full_name)+'</td><td>'+esc(sec?.name||'')+'</td><td>'+(u?'<a class=\\\"btn success small\\\" href=\\\"'+wa+'\\\" target=\\\"_blank\\\">WhatsApp</a> <button class=\\\"btn small\\\" onclick=\\\"navigator.clipboard?.writeText(\\\''+esc(u).replaceAll('\\\'','')+'\\\');alert(\\\'Link copiado.\\\')\\\">Copiar link</button>':'<span class=\\\"muted\\\">Link não disponível</span>')+'</td><td><button class=\\\"btn danger small\\\" onclick=\\\"deleteResearcher(\\\''+r.id+'\\\')\\\">Excluir</button></td></tr>'}).join('');
            shell('Pesquisadores','Acessos individuais por setor','<div class=\\\"grid two\\\"><div class=\\\"card\\\"><h2>Novo pesquisador</h2><div id=\\\"rm\\\"></div><div class=\\\"formgrid\\\"><div class=\\\"field\\\"><label>Nome</label><input id=\\\"rn\\\"></div><div class=\\\"field\\\"><label>Telefone</label><input id=\\\"rp\\\" inputmode=\\\"tel\\\"></div><div class=\\\"field\\\"><label>Setor</label><select id=\\\"rs\\\">'+data.sectors.map(s=>'<option value=\\\"'+s.id+'\\\">'+esc(s.name)+'</option>').join('')+'</select></div></div><br><button id=\\\"crb\\\" class=\\\"btn primary\\\" onclick=\\\"createR()\\\">Criar acesso de pesquisador</button></div><div class=\\\"card\\\"><h2>Pesquisadores cadastrados</h2><div class=\\\"table\\\"><table><tr><th>Nome</th><th>Setor</th><th>Link</th><th>Ações</th></tr>'+rows+'</table></div><br><button class=\\\"btn\\\" onclick=\\\"render(\\\'setores\\\')\\\">◉ Gerenciar setores</button></div></div>','pesquisadores')
          }
          async function createR(){
            const b=$(\"crb\"); const name=$(\"rn\").value.trim(), phone=$(\"rp\").value.trim(), sector=$(\"rs\").value;
            if(!name)return $(\"rm\").innerHTML='<div class=\\\"notice err\\\">Informe o nome do pesquisador.</div>';
            const key=name.toLowerCase()+'|'+sector; const saved=JSON.parse(localStorage.getItem('p20_researcher_links')||'{}');
            if(saved[key]){ $(\"rm\").innerHTML='<div class=\\\"notice ok\\\"><b>Este pesquisador já possui acesso.</b><br><small>'+esc(saved[key].url)+'</small><br><br><a class=\\\"btn success\\\" href=\\\"'+saved[key].wa+'\\\" target=\\\"_blank\\\">Enviar pelo WhatsApp</a></div>'; return }
            if(b)b.disabled=true;
            $(\"rm\").innerHTML='<div class=\\\"notice\\\">Criando acesso do pesquisador…</div>';
            try{let j=await api('create_link',{role:'researcher',display_name:name,sector_id:sector,phone});let u=j.url||location.origin+location.pathname+'?access='+encodeURIComponent(j.link_token);let wa='https://wa.me/?text='+encodeURIComponent('Acesso Pesquisa 2.0 — Pesquisador\\n'+u+'\\nSenha inicial: 1234');saved[key]={url:u,wa,phone};localStorage.setItem('p20_researcher_links',JSON.stringify(saved));if(j.access?.id){saved[j.access.id]={url:u,wa,phone};localStorage.setItem('p20_researcher_links',JSON.stringify(saved))}$(\"rm\").innerHTML='<div class=\\\"notice ok\\\"><b>✓ Acesso criado com sucesso.</b><br><small>'+esc(u)+'</small><br><br><a class=\\\"btn success\\\" href=\\\"'+wa+'\\\" target=\\\"_blank\\\">Enviar pelo WhatsApp</a></div>';await load();render('pesquisadores')}catch(e){$(\"rm\").innerHTML='<div class=\\\"notice err\\\"><b>Não foi possível criar o acesso.</b><br>'+esc(e.message)+'</div>'}finally{if(b)b.disabled=false}}
          """
          s=s[:old.start()]+new+s[old.end()-len('async function createR()'):]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit se houver alteração
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "Melhorar criação e links dos pesquisadores" && git push)
